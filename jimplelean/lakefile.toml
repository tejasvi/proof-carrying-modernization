name = "JimpleLean"
version = "0.1.0"
defaultTargets = ["Jimple"]

[[lean_lib]]
name = "Jimple"
moreLeanArgs = ["-DElab.async=false"]
# tactics, simprocs and the importer run as native code in dependent modules
precompileModules = true

[[lean_lib]]
name = "Examples"
moreLeanArgs = ["-DElab.async=false"]

[[lean_exe]]
name = "jimple-run"
root = "JimpleRun"
moreLeanArgs = ["-DElab.async=false"]
