sources = ["sum.ts", "mean.ts", "sumBy.ts", "meanBy.ts", "lerp.ts", "inverseLerp.ts", "median.ts",
           "medianBy.ts", "round.ts", "percentile.ts", "clamp.ts", "inRange.ts"]
tests = ["sum.spec.ts", "mean.spec.ts", "sumBy.spec.ts", "meanBy.spec.ts", "lerp.spec.ts",
         "inverseLerp.spec.ts", "median.spec.ts", "medianBy.spec.ts", "round.spec.ts",
         "percentile.spec.ts", "clamp.spec.ts", "inRange.spec.ts"]

[[variants]]
name = "default"
