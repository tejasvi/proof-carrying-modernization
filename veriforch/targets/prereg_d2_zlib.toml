# PREREG D2 (frozen v1, ~/fv_paper/prereg/PREREG_D2_v1.md): the same target as D's targets/prereg_zlib.toml, renamed so D2 has its own
# vo run directory (runs/prereg_d2_zlib); bridge pins are given at launch (scripts/prereg_d2.py) and recorded at start.
# Prereg D (frozen v2): zlib 1.3.1 (51b7f2abdade), the frozen source tree of the prereg package (archive sha256 in
# ~/fv_paper/prereg/D/downloads.sha256), the 15 library files of Makefile.in (OBJZ + OBJG), compiled alone with the
# prereg's flags and linked by cir2lean (--link). No project build script runs.
name = "prereg_d2_zlib"
lang = "cir"
root = "/home/user/fv_paper/prereg/D/src_zlib/zlib-1.3.1"
sources = ["adler32.c", "crc32.c", "deflate.c", "infback.c", "inffast.c", "inflate.c", "inftrees.c", "trees.c", "zutil.c", "compress.c", "uncompr.c", "gzclose.c", "gzlib.c", "gzread.c", "gzwrite.c"]
link_mode = "cir2lean"

[[variants]]
name = "lib"
flags = ["-std=c11", "-DHAVE_UNISTD_H", "-DHAVE_STDARG_H", "-D_LARGEFILE64_SOURCE=1", "-DHAVE_HIDDEN"]
