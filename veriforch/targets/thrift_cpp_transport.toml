# Apache Thrift @ f0eb8b84eb56 (targets/thrift_PIN.txt; UNTRUSTED tree, no build script of it runs), T1 coverage scan
# (no model calls), C++ component "transport": the TUs of lib/cpp/src/thrift/transport that a Linux CMake build compiles
# (OpenSSL, libevent and zlib found; Qt5 absent; Windows files out). Build inputs are hand-made from the CMake files
# read as data: thrift_cpp_transport.compile_commands.json (scratch/thrift_cxx/tools/mk_compdb.py), thrift_cpp_config/thrift/config.h,
# external headers as data under deps/thrift_headers (VERSIONS.txt). Each compile_commands entry is one build variant
# (one TU). root is lib/cpp/src, so every lib/cpp function a TU emits (its own and inline header code of other
# components) is a unit; notes/thrift/T1_cxx.md assigns each unit to the component of its defining file.
# -w: warnings off (clang error text only in the logs); loc_from_definition: out-of-line members carry the line of
# their definition (the D2 fix, build.py).
name = "thrift_cpp_transport"
lang = "cir"
root = "/home/user/veriforch/targets/thrift/lib/cpp/src"
compile_commands = "/home/user/veriforch/targets/thrift_cpp_transport.compile_commands.json"
cflags = ["-w"]
loc_from_definition = true
