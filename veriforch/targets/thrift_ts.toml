# Apache Thrift lib/ts at f0eb8b8 (targets/thrift_PIN.txt), step T1: the coverage scan, no model calls. UNTRUSTED
# target: no npm script or build file of it runs. lib/ts holds thrift.d.ts (the declarations of the browser library,
# whose code is JavaScript: lib/js/src/thrift.js; no function bodies) and the browser tests test/test.ts and
# test/test-int64.ts (QUnit, importing code generated by the Thrift compiler, which is not in the repository).
# Extraction = StrictTS's own coverage mode at the D2 pin (deps/strictts-44d6b9b), strict subset, as the D2 es-toolkit
# target (prereg_d2_estoolkit.toml), on a scratch copy of the listed files (tools/thrift_rsts/scan_ts.py; the clone is
# shared and stays read only). The coverage tsconfig extends the project's own tsconfig.json.
name = "thrift_ts"
lang = "strictts"
root = "/home/user/veriforch/scratch/thrift_rsts/ts/project/lib/ts"
source_root = "/home/user/veriforch/targets/thrift/lib/ts"
copy = ["thrift.d.ts", "tsconfig.json", "test/test.ts", "test/test-int64.ts"]
extraction = "coverage"
coverage_project = "thrift-ts"
strict = true
translate_timeout = 1800
sources = []

[coverage_tsconfig]
extends = "./tsconfig.json"

[[variants]]
name = "src"
flags = []
